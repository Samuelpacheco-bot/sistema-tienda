<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel administrador | Casa Norte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom bg-white"><div class="container py-2"><a class="navbar-brand brand-mark" href="{{ url_for('storefront') }}">CASA <span>NORTE</span></a><div class="d-flex align-items-center gap-3"><small class="text-secondary d-none d-sm-inline">{{ admin_email }}</small><form method="post" action="{{ url_for('admin_logout') }}"><button class="btn btn-outline-dark btn-sm rounded-0" type="submit">Cerrar sesión</button></form></div></div></nav>
  <main class="admin-page container py-5">
    <div class="section-heading d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><p class="eyebrow mb-2">CONTROL INTERNO</p><h1>Panel administrador</h1></div><span id="adminDate" class="muted-label">Cargando...</span></div>
    <div id="adminMetrics" class="row g-3 mb-5"></div>
    <div class="row g-4"><div class="col-lg-6"><div class="admin-block"><h2>Ventas del día</h2><div id="dailySales">Cargando...</div></div></div><div class="col-lg-6"><div class="admin-block"><h2>Compras de inventario</h2><div id="dailyPurchases">Cargando...</div></div></div><div class="col-12"><div class="admin-block"><h2>Productos agotados</h2><div id="outOfStock">Cargando...</div></div></div><div class="col-12"><div class="admin-block"><h2>Reponer stock</h2><form id="restockForm" class="row g-3 align-items-end"><div class="col-md-6"><label for="restockProduct" class="form-label">Producto</label><select id="restockProduct" class="form-select rounded-0" required></select></div><div class="col-md-3"><label for="restockQuantity" class="form-label">Unidades</label><input id="restockQuantity" class="form-control rounded-0" type="number" min="1" value="1" required></div><div class="col-md-3"><button class="btn btn-dark rounded-0 w-100" type="submit">Agregar stock</button></div></form><div id="restockMessage" class="small mt-3"></div></div></div></div>
  </main>
  <script>
    const money = value => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'USD' }).format(Number(value || 0));
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[character]));
    function rows(items, purchases) { if (!items.length) return '<p class="text-secondary mb-0">No hay registros hoy.</p>'; return `<div class="table-responsive"><table class="table table-sm align-middle mb-0"><tbody>${items.map(item => purchases ? `<tr><td>${escapeHtml(item.nombre || 'Producto')}</td><td>${item.cantidad} unidades</td><td class="text-end fw-bold">${money(item.total)}</td></tr>` : `<tr><td>Venta #${item.id}</td><td>${new Date(item.fecha).toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit'})}</td><td class="text-end fw-bold">${money(item.total)}</td></tr>`).join('')}</tbody></table></div>`; }
    async function loadSummary() { const response = await fetch('{{ url_for("admin_summary") }}'); if (response.status === 401) { location.href = '{{ url_for("admin_login") }}'; return; } const summary = await response.json(); document.getElementById('adminDate').textContent = `Actualizado · ${summary.fecha}`; document.getElementById('adminMetrics').innerHTML = [['Ventas', money(summary.ventas.monto), `${summary.ventas.cantidad} operaciones · ${summary.ventas.unidades} unidades`], ['Compras', money(summary.compras.monto), `${summary.compras.cantidad} abastecimientos · ${summary.compras.unidades} unidades`], ['Disponibles', summary.inventario.disponibles, 'productos en catálogo'], ['Agotados', summary.inventario.agotados, 'requieren reposición']].map(metric => `<div class="col-6 col-xl-3"><div class="metric-card"><span>${metric[0]}</span><strong>${metric[1]}</strong><small>${metric[2]}</small></div></div>`).join(''); document.getElementById('dailySales').innerHTML = rows(summary.ventas_del_dia, false); document.getElementById('dailyPurchases').innerHTML = rows(summary.compras_del_dia, true); document.getElementById('outOfStock').innerHTML = summary.agotados.length ? summary.agotados.map(product => `<span class="stock-alert"><i class="bi bi-exclamation-circle"></i>${escapeHtml(product.nombre)}</span>`).join('') : '<p class="text-secondary mb-0">No hay productos agotados.</p>'; const productsResponse = await fetch('/productos'); const products = await productsResponse.json(); document.getElementById('restockProduct').innerHTML = products.map(product => `<option value="${product.id}">${escapeHtml(product.nombre)} · stock ${product.stock}</option>`).join(''); }
    document.getElementById('restockForm').addEventListener('submit', async event => { event.preventDefault(); const message = document.getElementById('restockMessage'); const response = await fetch('/compras', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ producto_id: Number(document.getElementById('restockProduct').value), cantidad: Number(document.getElementById('restockQuantity').value) }) }); const result = await response.json(); message.textContent = response.ok ? `Stock actualizado: ${result.producto.nombre} ahora tiene ${result.producto.stock} unidades.` : result.error; if (response.ok) { document.getElementById('restockQuantity').value = 1; loadSummary(); } });
    loadSummary();
  </script>
</body>
</html>
