<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrador | Casa Norte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <div class="login-box">
      <p class="eyebrow">AREA PRIVADA</p>
      <h1>Acceso administrador</h1>
      <p class="text-secondary">Ingresa con el correo autorizado para consultar el inventario y las operaciones.</p>
      {% if error %}<div class="alert alert-danger rounded-0">{{ error }}</div>{% endif %}
      <form method="post" class="mt-4">
        <label for="email" class="form-label">Correo</label>
        <input id="email" name="email" type="email" class="form-control mb-3" autocomplete="username" required>
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        <button class="btn btn-dark rounded-0 w-100 py-3 mt-4" type="submit">Entrar al panel</button>
      </form>
      <a class="back-link" href="{{ url_for('storefront') }}">Volver a la tienda</a>
    </div>
  </main>
</body>
</html>
